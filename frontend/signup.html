<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Flow - 회원가입</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <h1 class="auth-title">환영해요</h1>
      <p class="auth-subtitle">아이디와 비밀번호로 회원가입하세요.</p>

      <div class="auth-tabs">
        <a class="auth-tab" href="index.html">로그인</a>
        <span class="auth-tab active">회원가입</span>
      </div>

      <form id="signup-form" class="auth-form" novalidate>
        <div class="form-field">
          <label for="signup-username">아이디</label>
          <input id="signup-username" name="username" type="text" placeholder="영문 소문자·숫자·_, 4~20자" autocomplete="username">
        </div>
        <div class="form-field">
          <label for="signup-password">비밀번호</label>
          <div class="password-field">
            <input id="signup-password" name="password" type="password" placeholder="8자 이상" autocomplete="new-password">
            <button type="button" id="signup-password-toggle" class="password-toggle"></button>
          </div>
        </div>
        <button id="signup-button" type="submit" class="auth-submit">회원가입</button>
      </form>
      <p id="signup-error" class="form-error" role="alert"></p>
    </div>
  </div>

  <script src="api.js"></script>
  <script src="signup.js"></script>
</body>
</html>
